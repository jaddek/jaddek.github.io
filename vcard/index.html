<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anton (Tony) Nazarov | Fullstack Software Engineer</title>
    <meta name="description" content="Anton (Tony) Nazarov | Fullstack Software Engineer">
    <meta name="keywords"
          content="software developer, full-stack developer, web developer, backend developer, frontend developer, cloud developer, software engineer, C# developer, .NET developer, Python developer, TypeScript developer, PHP developer, SQL databases, NoSQL databases, Online transaction processing (OLTP) databases, MongoDB, PostgreSQL, MySQL, REST API, GraphQL, gRPC, microservices architecture, software development, software projects, Kubernetes, Docker, ASP.NET Core, React, Angular, Node.js">

    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --logo-size: auto;
            --logo-qr-size: 300px;
        }

        body {
            background-color: white;
            color: #0072BC;
            font-family: 'Roboto', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
        }

        .main-content {
            padding: 0 2rem;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 1rem 0;
        }

        h2 {
            color: #095584;
            padding-bottom: 1.25rem;
            margin: 2rem 0 0 0;
            font-size: 1.875rem;
            font-weight: normal;
        }

        .qr-code-container {
            display: flex;
            margin-top: 2rem;
            width: 100%;
        }

        .qr-code {
            width: 400px;
            height: 400px;
        }

        .main-content p,
        .main-content a {
            color: #095584;
            font-size: 1.25rem;
        }

        #logo-container {
            position: fixed;
            top: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            transform: rotate(-90deg);
            position: absolute;
            top: 70px;
            right: -150px;
        }

        .logo-sm {
            width: 150px;
            display: none;
        }

        @media (max-width: 1100px) {

            .logo {
                display: none;
            }

            .logo-sm {
                display: block;
            }
        }

        @media (min-width: 1100px) {
            .logo-sm {
                display: none;
            }
        }

        @media (max-width: 900px) {
            h1 {
                font-size: 2rem;
            }

            h2 {
                font-weight: bold;
                font-size: 1.5rem;
            }

            .qr-code {
                width: var(--logo-qr-size);
                height: var(--logo-qr-size);
            }

            .main-content p,
            .main-content a {
                font-size: 1rem;
            }
        }

        .logo {
            width: var(--logo-size);
        }
    </style>

</head>
<body>
<div class="main-content">
    <img class="logo-sm" src="/img/logo.png" alt="Tony Nazarov Logo">
    <h2>Fullstack Software Engineer</h2>
    <h1>Anton (Tony) Nazarov</h1>
    <p>Email: <a href="mailto:anton@tonynazarov.com">anton@tonynazarov.com</a></p>
    <p>Phone NZ: (+64) <a href="tel:021 0800 5036">021 0800 5036</a></p>
    <p>Website: <a href="https://tonynazarov.com" target="_blank" rel="noopener noreferrer">tonynazarov.com</a></p>
    <div class="qr-code-container">
        <img class="qr-code" src="/img/8a622f908e7baa7f0d7df9a76461aa8f.svg" alt="Contact QR Code">
    </div>
</div>
<div id="logo-container">
    <img class="logo" src="/img/logo-x.png" alt="">
</div>
<script>
    function adjustLogoSize() {
        const windowHeight = window.innerHeight;
        const logoSize = Math.max(windowHeight * 1.1, 500);
        const qrSize = Math.max(windowHeight * 0.001, 300);


        document.documentElement.style.setProperty('--logo-size', `${logoSize}px`);
        document.documentElement.style.setProperty('--logo-qr-size', `${qrSize}px`);
    }

    adjustLogoSize();
    window.addEventListener('resize', adjustLogoSize);
</script>
</body>
</html>
